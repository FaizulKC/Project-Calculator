<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Calculator App</h1>
    
    <div class="body">
        <div id="output">
            <input type="text" value="">
        </div>

        <div id="arithmetic">
            <button class="alu arith" value="+">+</button>
            <button class="alu arith" value="-">-</button>
            <button class="alu arith" value="*">x</button>
            <button class="alu arith" value="/">/</button>

        </div>

        <div id="first-row">
            <button class="alu1 btn" value="7">7</button>
            <button class="alu1 btn" value="8">8</button>
            <button class="alu1 btn" value="9">9</button>
            <button class="alunum btn" value="equal">=</button>
            

        </div>

        <div id="sec-row">
            <button class="alu1 btn" value="4">4</button>
            <button class="alu1 btn" value="5">5</button>
            <button class="alu1 btn" value="6">6</button>

        </div>

        <div id="sec-row">
            <button class="alu1 btn" value="1">1</button>
            <button class="alu1 btn" value="2">2</button>
            <button class="alu1 btn" value="3">3</button>

        </div>

        <div id="sec-row">
            <button class="alu1 btn" value="0">0</button>
            <button class="alu1" value=".">.</button>
            <button type="reset" class="alu1" value="AC">AC</button>

        </div>

    </div>

    <script src="app.js"></script>
</body>


</html>
